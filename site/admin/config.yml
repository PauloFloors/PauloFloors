backend:
  name: git-gateway
  branch: main

publish_mode: simple

collections:
  - name: "gallery_installation"
    label: "Fotos — Hardwood Floor Installation"
    folder: "content/gallery-hardwood-floor-installation"
    create: true
    slug: "{{fields.slug}}"
    media_folder: "/site/images/gallery/installation"
    public_folder: "/images/gallery/installation"
    fields:
      - { label: "Foto", name: "image", widget: "image" }
      - { label: "Descrição (em inglês)", name: "caption", widget: "string" }
      - { label: "Ordem (menor aparece primeiro)", name: "order", widget: "number", default: 99, required: false }
      - { label: "Slug (não editar)", name: "slug", widget: "hidden", default: "{{fields.caption}}" }

  - name: "gallery_refinishing"
    label: "Fotos — Hardwood Floor Refinishing"
